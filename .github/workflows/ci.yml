name: CI - Pruebas y Despliegue en Render

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests-backend:
    name: Tests Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4        # ← v4 en vez de v3

      - name: Configurar Python
        uses: actions/setup-python@v5   # ← v5 en vez de v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          cd backend
          pip install fastapi uvicorn pytest pytest-mock httpx pydantic

      - name: Ejecutar todos los tests
        run: |
          cd backend
          pytest tests/ -v --tb=short

  tests-e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: tests-backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4        # ← v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4      
        with:
          node-version: '20'

      - name: Instalar dependencias Node
        run: npm install

      - name: Instalar Playwright y browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Arrancar backend en background
        run: |
          pip install fastapi uvicorn pydantic
          cd backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 8

      - name: Verificar que el backend responde
        run: curl http://localhost:8000/

      - name: Ejecutar pruebas E2E
        run: npx playwright test --reporter=list

  deploy-render:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: [tests-backend, tests-e2e]

    steps:
      - name: Trigger deploy en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo " Despliegue en Render correcto"