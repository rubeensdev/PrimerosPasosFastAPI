name: CI - Pruebas y Despliegue en Render

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests-backend:
    name: Tests Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          cd backend
          pip install fastapi uvicorn pytest pytest-mock httpx pydantic

      - name: Ejecutar todos los tests
        run: |
          cd backend
          pytest tests/ -v --tb=short

  tests-e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: tests-backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Playwright
        run: npx playwright install --with-deps chromium

      - name: Arrancar backend en background
        run: |
          cd backend
          pip install fastapi uvicorn pydantic
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Ejecutar pruebas E2E
        run: npx playwright test --reporter=list

  deploy-render:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: [tests-backend, tests-e2e]  # Solo despliega si los tests son exitosos

    steps:
      - name: Trigger deploy en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo " Despliegue en Render exitoso"